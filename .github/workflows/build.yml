name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    # a tag ending in -debugger (from the debugger branch): "FM-1 Big Screen Debugger", downloads named …-debugger
    env:
      DEBUGGER: ${{ endsWith(github.ref_name, '-debugger') && '1' || '' }}
      FEAT: ${{ endsWith(github.ref_name, '-debugger') && '--features debugger' || '' }}
      SFX: ${{ endsWith(github.ref_name, '-debugger') && '-debugger' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo test $FEAT
      - if: matrix.name == 'mac'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          sed -i '' '/\/Applications/d' make_app.sh
          ./make_app.sh
          APPN="FM-1 Big Screen"; [ "$DEBUGGER" = 1 ] && APPN="FM-1 Big Screen Debugger"
          (cd dist && ditto -c -k --keepParent "$APPN.app" ../FM-1-Mirror-mac$SFX.zip)
          LITE=1 ./make_app.sh
          (cd dist && ditto -c -k --keepParent "$APPN.app" ../FM-1-Mirror-mac-lite$SFX.zip)
      - if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release $FEAT
          cp target/release/fm1-mirror.exe FM-1-Mirror-windows$SFX.exe
          cargo build --release --no-default-features $FEAT
          cp target/release/fm1-mirror.exe FM-1-Mirror-windows-lite$SFX.exe
      - if: matrix.name == 'linux'
        run: |
          cargo build --release $FEAT
          cp target/release/fm1-mirror FM-1-Mirror-linux$SFX
          cargo build --release --no-default-features $FEAT
          cp target/release/fm1-mirror FM-1-Mirror-linux-lite$SFX
      - uses: actions/upload-artifact@v4
        with:
          name: fm1-mirror-${{ matrix.name }}
          path: FM-1-Mirror-*

  # On a v* tag: put the downloads on a GitHub Release for that tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l
          gh release create "${{ github.ref_name }}" FM-1-Mirror-* --repo "${{ github.repository }}" \
            --title "FM-1 Big Screen ${{ github.ref_name }}" --notes-file - <<'NOTES'
          The M-VAVE FM-1's screen, big, on Mac, Windows and Linux (Android: pfkellogg/fm1-mirror-spyglass-android). See the README for setting up the
          FM-1 (two steps, and how to go back). Contact: pfkellogg@gmail.com
          NOTES
