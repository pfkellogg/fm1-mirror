[package]
name = "fm1-mirror"
version = "1.3.4"
edition = "2021"
description = "Shows the M-VAVE FM-1's screen big, sent over USB by the FM-1 Big Screen firmware"

[dependencies]
eframe = "=0.31.1"
midir = "0.10"
cpal = "0.15"
earcutr = "0.4"
serde_json = "1"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
coremidi-sys = "3.2"
core-foundation-sys = "0.8"
