[package]
name = "fm1-mirror"
version = "1.3.31"
edition = "2021"
description = "Shows the M-VAVE FM-1's screen big, sent over USB by the FM-1 Big Screen firmware"

[features]
# "full": the Mellotron's flute, strings and choir built in; `--no-default-features` builds "lite", which can download them.
default = ["bundled-sounds"]
bundled-sounds = []

[dependencies]
eframe = "=0.31.1"
midir = "0.10"
cpal = "0.15"
claxon = "0.4"      # FLAC, for the Mellotron's strips
ureq = "2"          # the list of Mellotron sounds online, and their downloads
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
earcutr = "0.4"
serde_json = "1"
dirs = "5"
rustysynth = "1.3.8"

[target.'cfg(target_os = "macos")'.dependencies]
coremidi-sys = "3.2"
core-foundation-sys = "0.8"
raw-window-handle = "0.6"
